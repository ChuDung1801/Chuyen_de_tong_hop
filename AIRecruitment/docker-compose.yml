services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 15s
      timeout: 8s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AIRecruitmentDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      AIService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      Jwt__Secret: ${JWT_SECRET:-development_only_replace_this_secret_32_chars_minimum}
      CV_STORAGE_PATH: /app/uploads/cvs
      RECRUITER_VERIFICATION_STORAGE_PATH: /app/uploads/recruiter-verification
    volumes:
      - cv_uploads:/app/uploads/cvs
      - recruiter_verification_uploads:/app/uploads/recruiter-verification
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  sqlserver_data:
  cv_uploads:
  recruiter_verification_uploads:
